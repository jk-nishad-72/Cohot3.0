

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> FocusDesk | Productivity Dashboard </title> 
    <link rel="icon" href="./images/logo.png"> 
    

    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>

    <link rel="stylesheet" href="style.css">
</head>
<body>

     <!-- 
        <i class="ri-moon-line"></i>
        <i class="ri-sun-fill"></i>
        <i class="ri-close-large-fill"></i>
     -->


    <main  > 
        
        
        <section class="allElems">

         <!-- <video autoplay loop  src="./video/night-vid.mp4"></video> -->

         <video class="bg-vid" autoplay loop muted>
            <source src="./video/night-vid.mp4" type="video/mp4">
        </video>

            <!-- Navbar  -->

             <nav> 
                 <div class="nav-left">
                     <img class="logo" src="./images/logoname.webp" alt=""> 
                 </div>

                 <div class="nav-right">
                    <i class="ri-moon-line dark "></i>
                    <i class="ri-sun-fill light "></i>
                 </div>
        
             </nav>


             <!-- widgets date and time -->

              <section class="wetherAndDate">

                
                <div class="DateAndTime">

                   <h2 class="date">20 june 2025 </h2>
                   <h1 class="day">Saturday, 1:00:00 </h1>
                   <h1 class="time"> pM </h1>
                   <h4 class="city"> Raipur <span> (CG) </span></h4>

                </div> 

                <div class="wether"> 

                    <h2 class="temp"> 20° C </h2>
                    <!-- <h4> Light rain </h4> -->

                    <h3 class="weatherCode">weatherCode: 35% </h3>
                    <h3 class="windDirection">windDirection: 49% </h3>
                    <h3 class="windSpeed">windSpeed: 10 km/h</h3>

                </div>


              </section>


              <section class="allFeatures"> 

                 <div id="0" class="feature  todo">

                    <video id="0" class="todo-vid"  autoplay loop muted >

                        <source src="./video/todo-video.mp4" type="video/mp4">

                    </video>

                    <h3 id="0" > todo  </h3>

                    <img src="./images/todo-image.jpg" alt="">
                 </div>

                  <div id="1" class="feature daily">

                       <video id="1" class="daily-vid" autoplay loop muted >

                        <source src="./video/daily-video.mp4" type="video/mp4">

                    </video>

                    <h3 id="1" > Daily   </h3>

                    <img src="./images/daily-image.avif" alt="">


                 </div>


                  <div id="2" class="feature  moti">

                    
                        <video id="2" class="moti-vid" autoplay loop muted >

                        <source src="./video/motivation-video.mp4" type="video/mp4">

                    </video>

                    <h3 id="2" > Energy  </h3> 


                    <img src="./images/moti-image.avif" alt="">
                 </div>

                  <div id="3" class="feature  pomo">
                   

                     <video id="3" class="pomo-vid" autoplay loop muted >

                        <source src="./video/pomo-video.mp4" type="video/mp4">

                    </video>

                    <h3 id="3" > POmo </h3>

                    <img src="./images/pomo-image.avif" alt="">
                 </div>

                  <div id="4" class="feature  goal">

                     <video id="4" class="goal-vid" autoplay loop muted >

                        <source src="./video/goal-video.mp4" type="video/mp4">

                    </video>

                    <h3 id="4" > goals  </h3>

                    <img src="./images/goal-image.avif" alt="">
                 </div>

              </section>



        </section>


  

         <!--* All Feature Full Page -->



          <!--* Todo  -->
        <section id='0' class="fullElem todo-list-fullPage  ">

            <h1> 
                 Your Personalised Task's list
                 <i id="0" class="ri-close-large-line back  "></i>
    
            </h1>

            <div class="todo-feature">

                <form class="addTask" action="">

                    <input 
                    id="taskTitle"
                    required
                    type="text"
                    placeholder="Enter Task">

                    <textarea 

                     required
                     name=""
                       id="taskDescr"
                     placeholder="Task Description"
                     ></textarea>

                   <h3 id="markImortant"> 
                    <input 
                    
                    type="checkbox" 
                    name="imp" id="imp"> 
                    <label for="imp">Mark as Important </label>
                   </h3>

                   <button  type="submit"   id="addTask"> <i class="ri-add-line"></i> Add Task  </button>

                </form>

                <div class="todo-list-container">

                    <!-- <div class="task-box">

                         <h1 class="title" > 
                            Title
                             <sup class="important  "  > 
    
                            <i class="ri-star-half-s-fill"></i> </sup> </h1>
                         <p class="description"> Task Description  </p>

                         <button class="completed" > Marks as Completed  </button>

                    </div> -->

                </div>
            </div>

        </section>

        
        
        <section id="1" class="fullElem daily-planner-fullPage  " >

            <h1>   
                   Your Personalised Daily Plan

                   <i  id="1"  class="ri-close-large-fill back"></i> 
                
             </h1>

        </section>   


         <section id="2" class="fullElem moti-fullPage  " >

            <h1>   
                   Your Motivation 

                   <i  id="2"  class="ri-close-large-fill back"></i> 
                
             </h1>

        </section>   


         <section id="3" class="fullElem pomodoro-fullPage  " >

            <h1>   
                   Your Personalised Pomodor timer

                   <i  id="3"  class="ri-close-large-fill back"></i> 
                
             </h1>

        </section>   



         <section id="4" class="fullElem goals-fullPage  " >

            <h1>   
                   Your Personal goals 

                   <i  id="4"  class="ri-close-large-fill back"></i> 
                
             </h1>

        </section>   




    </main>



    <script src="script.js"></script>
</body>
</html>
