
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tasks Manager  </title>
    <link rel="shortcut icon" type="image" href="./Assets/task.png">
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>

<!-- icons 
 <i class="ri-search-ai-line"></i>

 <i class="ri-sun-line"></i>
 <i class="ri-moon-line"></i>
 <i class="ri-add-line"></i>

 <i class="ri-equalizer-2-line"></i>


 <i class="ri-check-line"></i>
 <i class="ri-edit-box-line"></i>
 <i class="ri-delete-bin-6-line"></i>

 <i class="ri-arrow-down-long-line"></i>
 -->

</head>
<body>

    <main>

         <nav>

            <div class="left">
                <h1>My Tasks </h1>
            </div> 
            <div class="center">
                <a href="#home">Home</a>
                <a href="#pending-tasks">Pending Tasks</a>
                <a href="#completed-tasks">Completed Tasks </a>
            </div>

            <div class="right">
                 <i class="ri-menu-3-line menu "></i>
                 <i class="ri-sun-line light"></i>
                <i class="ri-moon-line dark "></i>
            </div>

         </nav>

         <section id="home" class="sec-1">

                <div class="s1-top">

                    <div class="s1-top-left">

                        <div class="search-Box">
                            <i class="ri-search-ai-line"></i>
                            <input type="text" placeholder="Search..." >

                        </div>

                        <i class="ri-equalizer-2-line"></i> 
                        
                    </div>

                    <div class="s1-top-right">

                         <button class="creatBtn"> 
                             <i class="ri-add-line"></i>
                             <h1>New Task </h1> 
                         </button>
                    </div>


                </div>

                 <div id="task-list" class="s1-bottom">

                   <!-- 
                    <div class="task-card" data-id="1" data-status="pending" data-category="easy" >

                            <div class="tastCard-tp">
                                <h4>Easy</h4>   <img src="./Assets/Receipt Check.png" alt="">
                            </div> 

                            <div class="tastCard-center">
                                <h1> Class Attend Karna hai  </h1>
                            </div>
                            <div class="tastCard-btm">
                                <button id="checking" > <i class="ri-check-line"></i></button>
                                <button id="edit" >  <i class="ri-edit-box-line"></i></i></button>
                                <button id="del" >  <i class="ri-delete-bin-6-line"></i></i></button>
                            </div>
                    </div> -->


                 </div>

                 <div class="form">

                    <div class="wrapper">

                        
                    <i class="crossBtn ri-close-large-line"></i> 

                    <form action="">
                          <h1> Write Task </h1>
                          
                        <input class="title" type="text" placeholder="Enter Title">
                         
                        <select class="catgry" name="" id="category">
                            <option value="easy"> Easy </option>
                            <option value="medium"> Medium </option>
                            <option value="hard"> Hard </option>
                        </select>

                        <button class="addBtn" > Add Task </button>

                    </form>
                    </div>


                 </div>


         </section> 

         <section id="pending-tasks" class="sec-2">

            <h1> Pending Tasks </h1>

            <div class="pendingTaskList"> 


            </div>

         </section>

         
        <section id="completed-tasks" class="sec-3">

            <h1> Completed Tasks </h1>

            <div class="completedTaskList"> 


            </div>

         </section>

          <section class="sec-5">
            <h1> Browser Rendering Pipeline  </h1> 

            <div id="flow">

               <div class="flow-top">

                <div class="htmlBox">

                     <h1>1</h1>
                    <h2>HTML</h2>
                <img src="./Assets/arrow.png" alt="">
                  <h2>Parsing</h2>
                <img src="./Assets/arrow.png" alt="">
                 <h2> Tokenization </h2>
                <img src="./Assets/arrow.png" alt="">
                 <h2>DOM Tree </h2>
                <img src="./Assets/arrow.png" alt="">
            
                </div>

                <div class="cssBox">
                    <h1>2</h1>
                    <h2>CSS </h2>
                <img src="./Assets/arrow.png" alt="">
                  <h2> CSSOM Tree </h2>
                <img src="./Assets/arrow.png" alt="">

                </div>


               </div>

               <div class="flow-center"> 

                      <h1>3</h1>

                      <div class="addition">

                         <h2>DOM Tree  </h2>

                          <i class="ri-add-line"></i>

                         <h2>CSSOM Tree  </h2>
                            
                      </div>

                       <img src="./Assets/arrow.png" alt="">
               </div>

               <div class="flow-bottom">

                       <h1> Render Tree </h1>

                
               </div>



            </div>

         </section>


          <section class="sec-4">
            <h1> Event Propagation Demonstration  </h1>             
            <div class="grandFather">
                 <h2>GrandFather</h2>
                 <div class="father">
                    <h2>Father </h2>
                    <button class="child"> Click Me  </button>
                 </div>
            </div>
         </section>


        


         



    </main>
    <script src="script.js"></script>
</body>
</html>
